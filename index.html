<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .calendar-wrapper {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 32px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
      transition: all 0.3s ease;
    }

    .calendar-wrapper.year-view-active {
      max-width: 820px;
    }

    /* Header */
    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .calendar-nav {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }

    .nav-btn:active {
      transform: translateY(0);
      scale: 0.95;
    }

    .calendar-title {
      color: #fff;
      font-size: 22px;
      font-weight: 700;
      min-width: 180px;
      text-align: center;
      letter-spacing: -0.3px;
    }

    .calendar-title .year {
      font-weight: 400;
      color: rgba(255, 255, 255, 0.5);
      font-size: 18px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      padding: 8px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .action-btn.primary {
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-color: transparent;
    }

    .action-btn.primary:hover {
      background: linear-gradient(135deg, #7b93f5, #8b5cf6);
      border-color: transparent;
    }

    .action-btn.active {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
    }

    /* Day names */
    .day-names {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-bottom: 8px;
    }

    .day-name {
      text-align: center;
      color: rgba(255, 255, 255, 0.45);
      font-size: 13px;
      font-weight: 600;
      padding: 8px 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Days grid (month view) */
    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .day-cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.85);
      cursor: pointer;
      transition: all 0.15s ease;
      position: relative;
    }

    .day-cell:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .day-cell.other-month {
      color: rgba(255, 255, 255, 0.2);
    }

    .day-cell.today {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      font-weight: 700;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }

    .day-cell.today:hover {
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
      transform: translateY(-1px);
    }

    .day-cell.selected {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .day-cell.weekend {
      color: rgba(255, 107, 107, 0.6);
    }

    .day-cell.today.weekend {
      color: #fff;
    }

    /* Year view */
    .year-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 8px;
    }

    .month-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 16px;
      transition: all 0.2s ease;
    }

    .month-card:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 255, 255, 0.12);
    }

    .month-card-title {
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 12px;
      letter-spacing: -0.2px;
    }

    .month-card .day-names {
      margin-bottom: 4px;
    }

    .month-card .day-name {
      font-size: 10px;
      padding: 4px 0;
    }

    .month-card .days-grid {
      gap: 2px;
    }

    .month-card .day-cell {
      font-size: 11px;
      border-radius: 6px;
    }

    .month-card .day-cell.today {
      box-shadow: 0 2px 8px rgba(102, 126, 234, 0.4);
    }

    /* Footer */
    .calendar-footer {
      margin-top: 24px;
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    /* View transitions */
    .month-view-container,
    .year-view-container {
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .month-view-container.hidden,
    .year-view-container.hidden {
      display: none;
    }

    /* Responsive */
    @media (max-width: 640px) {
      .calendar-wrapper {
        padding: 20px 16px;
        border-radius: 16px;
      }

      .calendar-wrapper.year-view-active {
        max-width: 100%;
      }

      .calendar-title {
        font-size: 18px;
        min-width: 140px;
      }

      .year-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .day-cell {
        font-size: 13px;
      }

      .action-btn {
        padding: 6px 12px;
        font-size: 12px;
      }

      .nav-btn {
        width: 36px;
        height: 36px;
        font-size: 16px;
      }
    }

    @media (max-width: 400px) {
      .year-grid {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .month-card .day-cell {
        font-size: 10px;
      }

      .calendar-header {
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
      }
    }

    /* Fade-in animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .calendar-wrapper {
      animation: fadeIn 0.5s ease;
    }
  </style>
</head>
<body>
  <div class="calendar-wrapper" id="calendarWrapper">
    <!-- Header -->
    <div class="calendar-header">
      <div class="calendar-nav">
        <button class="nav-btn" id="prevBtn" title="Previous">◀</button>
        <div class="calendar-title" id="calendarTitle">January <span class="year">2025</span></div>
        <button class="nav-btn" id="nextBtn" title="Next">▶</button>
      </div>
      <div class="header-actions">
        <button class="action-btn primary" id="todayBtn">Today</button>
        <button class="action-btn" id="viewToggleBtn">Year</button>
      </div>
    </div>

    <!-- Month View -->
    <div class="month-view-container" id="monthView">
      <div class="day-names" id="dayNames">
        <div class="day-name">Sun</div>
        <div class="day-name">Mon</div>
        <div class="day-name">Tue</div>
        <div class="day-name">Wed</div>
        <div class="day-name">Thu</div>
        <div class="day-name">Fri</div>
        <div class="day-name">Sat</div>
      </div>
      <div class="days-grid" id="daysGrid"></div>
    </div>

    <!-- Year View -->
    <div class="year-view-container hidden" id="yearView">
      <div class="year-grid" id="yearGrid"></div>
    </div>

    <!-- Footer -->
    <div class="calendar-footer">
      <span style="color: rgba(255,255,255,0.3); font-size: 12px; letter-spacing: 0.3px;">
        Click a date to select it
      </span>
    </div>
  </div>

  <script>
    const today = new Date();
    let currentMonth = today.getMonth();
    let currentYear = today.getFullYear();
    let selectedDate = null;
    let isYearView = false;

    const monthNames = [
      "January", "February", "March", "April", "May", "June",
      "July", "August", "September", "October", "November", "December"
    ];

    const dayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

    const calendarWrapper = document.getElementById('calendarWrapper');
    const calendarTitle = document.getElementById('calendarTitle');
    const daysGrid = document.getElementById('daysGrid');
    const yearGrid = document.getElementById('yearGrid');
    const monthView = document.getElementById('monthView');
    const yearView = document.getElementById('yearView');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const todayBtn = document.getElementById('todayBtn');
    const viewToggleBtn = document.getElementById('viewToggleBtn');

    function isToday(day, month, year) {
      return day === today.getDate() && month === today.getMonth() && year === today.getFullYear();
    }

    function isSelected(day, month, year) {
      if (!selectedDate) return false;
      return day === selectedDate.getDate() && month === selectedDate.getMonth() && year === selectedDate.getFullYear();
    }

    function isWeekend(dayIndex) {
      return dayIndex === 0 || dayIndex === 6;
    }

    function renderMonthView() {
      const firstDay = new Date(currentYear, currentMonth, 1);
      const lastDay = new Date(currentYear, currentMonth + 1, 0);
      const startDayOfWeek = firstDay.getDay();
      const daysInMonth = lastDay.getDate();
      const daysInPrevMonth = new Date(currentYear, currentMonth, 0).getDate();

      calendarTitle.innerHTML = `${monthNames[currentMonth]} <span class="year">${currentYear}</span>`;

      let html = '';

      // Days from previous month
      for (let i = startDayOfWeek - 1; i >= 0; i--) {
        const day = daysInPrevMonth - i;
        html += `<div class="day-cell other-month">${day}</div>`;
      }

      // Days in current month
      for (let day = 1; day <= daysInMonth; day++) {
        const dateForCheck = new Date(currentYear, currentMonth, day);
        const dayOfWeek = dateForCheck.getDay();
        let classes = 'day-cell';
        if (isToday(day, currentMonth, currentYear)) classes += ' today';
        if (isSelected(day, currentMonth, currentYear)) classes += ' selected';
        if (isWeekend(dayOfWeek) && !isToday(day, currentMonth, currentYear)) classes += ' weekend';
        html += `<div class="${classes}" data-day="${day}" data-month="${currentMonth}" data-year="${currentYear}">${day}</div>`;
      }

      // Days from next month
      const totalCells = startDayOfWeek + daysInMonth;
      const remaining = (7 - (totalCells % 7)) % 7;
      for (let day = 1; day <= remaining; day++) {
        html += `<div class="day-cell other-month">${day}</div>`;
      }

      daysGrid.innerHTML = html;

      // Add click listeners to day cells
      document.querySelectorAll('#daysGrid .day-cell:not(.other-month)').forEach(cell => {
        cell.addEventListener('click', () => {
          const day = parseInt(cell.dataset.day);
          const month = parseInt(cell.dataset.month);
          const year = parseInt(cell.dataset.year);
          selectedDate = new Date(year, month, day);
          renderMonthView();
        });
      });
    }

    function renderYearView() {
      calendarTitle.innerHTML = `Year <span class="year">${currentYear}</span>`;

      let html = '';
      for (let m = 0; m < 12; m++) {
        const firstDay = new Date(currentYear, m, 1);
        const lastDay = new Date(currentYear, m + 1, 0);
        const startDayOfWeek = firstDay.getDay();
        const daysInMonth = lastDay.getDate();

        html += `<div class="month-card">
          <div class="month-card-title">${monthNames[m]}</div>
          <div class="day-names">
            ${dayNames.map(d => `<div class="day-name">${d[0]}</div>`).join('')}
          </div>
          <div class="days-grid">`;

        // Previous month days
        const daysInPrevMonth = new Date(currentYear, m, 0).getDate();
        for (let i = startDayOfWeek - 1; i >= 0; i--) {
          html += `<div class="day-cell other-month">${daysInPrevMonth - i}</div>`;
        }

        // Current month days
        for (let day = 1; day <= daysInMonth; day++) {
          const dateForCheck = new Date(currentYear, m, day);
          const dayOfWeek = dateForCheck.getDay();
          let classes = 'day-cell';
          if (isToday(day, m, currentYear)) classes += ' today';
          if (isSelected(day, m, currentYear)) classes += ' selected';
          if (isWeekend(dayOfWeek) && !isToday(day, m, currentYear)) classes += ' weekend';
          html += `<div class="${classes}">${day}</div>`;
        }

        // Next month days
        const totalCells = startDayOfWeek + daysInMonth;
        const remaining = (7 - (totalCells % 7)) % 7;
        for (let day = 1; day <= remaining; day++) {
          html += `<div class="day-cell other-month">${day}</div>`;
        }

        html += `</div></div>`;
      }

      yearGrid.innerHTML = html;
    }

    function switchView() {
      isYearView = !isYearView;
      if (isYearView) {
        monthView.classList.add('hidden');
        yearView.classList.remove('hidden');
        calendarWrapper.classList.add('year-view-active');
        viewToggleBtn.textContent = 'Month';
        viewToggleBtn.classList.add('active');
        renderYearView();
      } else {
        yearView.classList.add('hidden');
        monthView.classList.remove('hidden');
        calendarWrapper.classList.remove('year-view-active');
        viewToggleBtn.textContent = 'Year';
        viewToggleBtn.classList.remove('active');
        renderMonthView();
      }
    }

    function goToPrev() {
      if (isYearView) {
        currentYear--;
        renderYearView();
      } else {
        currentMonth--;
        if (currentMonth < 0) {
          currentMonth = 11;
          currentYear--;
        }
        renderMonthView();
      }
    }

    function goToNext() {
      if (isYearView) {
        currentYear++;
        renderYearView();
      } else {
        currentMonth++;
        if (currentMonth > 11) {
          currentMonth = 0;
          currentYear++;
        }
        renderMonthView();
      }
    }

    function goToToday() {
      const wasYearView = isYearView;
      currentMonth = today.getMonth();
      currentYear = today.getFullYear();
      selectedDate = null;
      if (wasYearView) {
        renderYearView();
      } else {
        renderMonthView();
      }
    }

    // Event Listeners
    prevBtn.addEventListener('click', goToPrev);
    nextBtn.addEventListener('click', goToNext);
    todayBtn.addEventListener('click', goToToday);
    viewToggleBtn.addEventListener('click', switchView);

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      switch (e.key) {
        case 'ArrowLeft': goToPrev(); break;
        case 'ArrowRight': goToNext(); break;
        case 't': case 'T': goToToday(); break;
        case 'v': case 'V': switchView(); break;
      }
    });

    // Initialize
    renderMonthView();
  </script>
</body>
</html>
